server {
    listen 4173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://calculator-app:8100;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prometheus/ {
        set $prometheus_upstream http://prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ollama/ {
        set $ollama_upstream http://host.docker.internal:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
