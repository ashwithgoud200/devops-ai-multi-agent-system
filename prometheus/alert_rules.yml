
groups:
  - name: devops_system_and_api_alerts
    interval: 15s
    rules:
      - alert: BackendUnavailable
        expr: |
          up{job="calculator-app", instance="host.docker.internal:8100"} == 0
          or
          devops_app_health_status{job="calculator-app", instance="host.docker.internal:8100"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "FastAPI calculator-app backend is unavailable"
          description: "The active calculator-app backend is unreachable or reporting unhealthy for more than 1 minute."

      - alert: PrometheusScrapeFailure
        expr: |
          up{job="calculator-app", instance="host.docker.internal:8100"} == 0
          or
          scrape_samples_scraped{job="calculator-app", instance="host.docker.internal:8100"} == 0
        for: 45s
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus scrape failure for calculator-app"
          description: "Prometheus failed to scrape the active calculator-app metrics endpoint for 45 seconds."

      - alert: ElevatedHttpErrorRate
        expr: |
          (
            100 * sum(rate(devops_http_requests_total{job="calculator-app", instance="host.docker.internal:8100", status=~"5.."}[5m]))
            / clamp_min(sum(rate(devops_http_requests_total{job="calculator-app", instance="host.docker.internal:8100"}[5m])), 0.001) > 5
            and sum(rate(devops_http_requests_total{job="calculator-app", instance="host.docker.internal:8100"}[5m])) > 0.05
          )
          or
          (
            100 * sum(rate(calc_requests_total{job="calculator-app", instance="host.docker.internal:8100", status="error"}[5m]))
            / clamp_min(sum(rate(calc_requests_total{job="calculator-app", instance="host.docker.internal:8100"}[5m])), 0.001) > 5
            and sum(rate(calc_requests_total{job="calculator-app", instance="host.docker.internal:8100"}[5m])) > 0.05
          )
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Elevated HTTP or calculator server error rate (> 5%)"
          description: "Server error rate exceeded 5% over a 5-minute window for 2 minutes, with sufficient traffic."

      - alert: HighApiLatencyP95
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(devops_http_request_duration_seconds_bucket{
                  job="calculator-app",
                  instance="host.docker.internal:8100",
                  endpoint!~"/incidents.*"
                }[5m])
              )
            ) > 1.0
            and
            sum(rate(devops_http_request_duration_seconds_count{
              job="calculator-app",
              instance="host.docker.internal:8100",
              endpoint!~"/incidents.*"
            }[5m])) > 0.05
          )
          or
          (
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(calc_latency_seconds_bucket{
                  job="calculator-app",
                  instance="host.docker.internal:8100"
                }[5m])
              )
            ) > 0.5
            and
            sum(rate(calc_latency_seconds_count{
              job="calculator-app",
              instance="host.docker.internal:8100"
            }[5m])) > 0.05
          )
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High P95 API latency detected"
          description: "P95 non-incident API latency exceeded 1 second or calculator latency exceeded 0.5 seconds for 2 minutes with sufficient traffic."

  - name: devops_agents_and_llm_alerts
    interval: 15s
    rules:
      - alert: AgentExecutionFailures
        expr: |
          sum by (agent) (
            increase(devops_agent_executions_total{
              job="calculator-app",
              instance="host.docker.internal:8100",
              outcome=~"error|invalid_response|timeout|configuration_error"
            }[10m])
          ) >= 2
        for: 1m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: "Repeated specialist agent execution failures ({{ $labels.agent }})"
          description: "Specialist agent {{ $labels.agent }} experienced 2 or more execution failures or schema validation errors within 10 minutes."

      - alert: LlmTimeoutOrFailureRate
        expr: |
          (
            100 * sum(rate(devops_llm_requests_total{
              job="calculator-app",
              instance="host.docker.internal:8100",
              status=~"timeout|failure|unavailable"
            }[10m]))
            /
            clamp_min(sum(rate(devops_llm_requests_total{
              job="calculator-app",
              instance="host.docker.internal:8100",
              status!="disabled"
            }[10m])), 0.0001)
          ) > 25
          and
          sum(increase(devops_llm_requests_total{
            job="calculator-app",
            instance="host.docker.internal:8100",
            status!="disabled"
          }[10m])) >= 2
        for: 2m
        labels:
          severity: warning
          component: llm_runtime
        annotations:
          summary: "Elevated LLM inference timeout/failure rate (> 25%)"
          description: "More than 25% of enabled LLM inference calls failed, timed out, or were unavailable over 10 minutes, with at least 2 active calls."

  - name: devops_infrastructure_alerts
    interval: 15s
    rules:
      - alert: ServiceTargetUnavailableOrRestarting
        expr: |
          up{job="calculator-app", instance="host.docker.internal:8100"} == 0
          or
          changes(process_start_time_seconds{
            job="calculator-app",
            instance="host.docker.internal:8100"
          }[10m]) >= 2
        for: 1m
        labels:
          severity: critical
          component: service_target
        annotations:
          summary: "Monitored service target is unreachable or restarting repeatedly"
          description: "The active calculator-app target is unreachable or its process start time changed 2 or more times within 10 minutes. This monitors HTTP availability and process restarts, not Docker Engine container health."
