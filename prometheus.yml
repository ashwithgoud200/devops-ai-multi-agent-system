global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: calculator-live-render
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - calculator-live-app.onrender.com
  - job_name: devops-control-plane
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
  - job_name: calculator-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8100
