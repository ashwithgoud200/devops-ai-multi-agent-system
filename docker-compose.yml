services:
  calculator-app:
    image: ${APP_IMAGE:-devops-agents-calculator:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-calculator
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
      - DEVOPS_LLM_ENABLED=${DEVOPS_LLM_ENABLED:-false}
      - DEVOPS_BASELINE_PATH=/app/data/baseline.json
      - DEVOPS_LOG_PATH=/app/logs/app.log
      - DEVOPS_AUDIT_LOG_PATH=/app/logs/incident_audit.jsonl
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - DEVOPS_GITHUB_ENABLED=${DEVOPS_GITHUB_ENABLED:-false}
      - DEVOPS_GITHUB_REPO=${DEVOPS_GITHUB_REPO:-}
      - DEVOPS_GITHUB_TOKEN=${DEVOPS_GITHUB_TOKEN:-}
      - DEVOPS_CI_EVIDENCE_ENABLED=${DEVOPS_CI_EVIDENCE_ENABLED:-false}
      - DEVOPS_SECURITY_EVIDENCE_ENABLED=${DEVOPS_SECURITY_EVIDENCE_ENABLED:-false}
      - DEVOPS_EVIDENCE_IMPORT_DIR=/app/data/ci-security-reports
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./data/ci-security-reports:/app/data/ci-security-reports:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: devops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-devops-agents-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    depends_on:
      calculator-app:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "127.0.0.1:4173:4173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  app_logs:
  prometheus_data:
  grafana_data:
