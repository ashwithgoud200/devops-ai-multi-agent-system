name: Legacy Combined CI-CD (Retired Manual Notice)

# Note: This legacy combined workflow has been retired and split into dedicated workflows:
# - .github/workflows/ci.yml             (Backend pytest, Frontend build, Docker validation)
# - .github/workflows/security.yml       (Secret scan, pip-audit, npm audit, Trivy image scan)
# - .github/workflows/docker-publish.yml (Pre-publish validation and GHCR image publishing)
# No duplicate CI, image publishing, or remote SSH deployment is executed here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Workflow Consolidation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Print dedicated workflow paths
        run: |
          echo "CI validation is handled by .github/workflows/ci.yml"
          echo "Security scanning is handled by .github/workflows/security.yml"
          echo "GHCR Docker publishing is handled by .github/workflows/docker-publish.yml"
